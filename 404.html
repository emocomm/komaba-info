<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ページが移動しました</title>
<script>
(function () {
  var base = {{ site.baseurl | jsonify }} || '';
  var path = window.location.pathname;
  if (base && path.indexOf(base) === 0) {
    path = path.slice(base.length);
  }
  var redirects = {
    '/20260511': '/entropy/',
    '/20260525': '/crypto/',
    '/20260608': '/scratch/'
  };
  for (var prefix in redirects) {
    if (path === prefix || path === prefix + '/' || path.indexOf(prefix + '/') === 0) {
      window.location.replace(base + redirects[prefix]);
      return;
    }
  }
})();
</script>
</head>
<body>
<h1>ページが見つかりません</h1>
<p>お探しのページは存在しないか、移動した可能性があります。<a href="{{ '/' | relative_url }}">トップページ</a>へ戻る。</p>
<footer><p style="font-size: 0.78rem; color: #666;">&copy; <a href="https://chujo.me" style="color: inherit;">Rintaro Chujo</a></p></footer>
</body>
</html>
