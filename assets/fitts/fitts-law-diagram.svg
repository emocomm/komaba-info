<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif" role="img" aria-labelledby="fitts-diagram-title">
  <title id="fitts-diagram-title">フィッツの法則の模式図：距離 D とターゲットの幅 W</title>
  <defs>
    <marker id="fitts-arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
    <marker id="fitts-arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#202124"/>
    </marker>
    <marker id="fitts-move-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- 移動の基準線 -->
  <line x1="120" y1="180" x2="520" y2="180" stroke="#d7dde5" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- 出発点（カーソル） -->
  <circle cx="120" cy="180" r="15" fill="#fff" stroke="#66706b" stroke-width="2"/>
  <circle cx="120" cy="180" r="4" fill="#66706b"/>
  <text x="120" y="232" text-anchor="middle" font-size="14" fill="#66706b">スタート地点</text>

  <!-- ターゲット -->
  <circle cx="470" cy="180" r="50" fill="#0f766e" fill-opacity="0.14" stroke="#0f766e" stroke-width="2.5"/>
  <circle cx="470" cy="180" r="6" fill="#0f766e"/>
  <text x="470" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">ターゲット</text>

  <!-- 移動の矢印 -->
  <line x1="142" y1="180" x2="408" y2="180" stroke="#0f766e" stroke-width="2.2" marker-end="url(#fitts-move-arrow)"/>

  <!-- D の寸法線（中心から中心へ） -->
  <line x1="120" y1="180" x2="120" y2="78" stroke="#b9c2cd" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="470" y1="130" x2="470" y2="78" stroke="#b9c2cd" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="120" y1="88" x2="470" y2="88" stroke="#202124" stroke-width="1.6" marker-start="url(#fitts-arrow-start)" marker-end="url(#fitts-arrow-end)"/>
  <text x="295" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">D：ターゲットまでの距離</text>

  <!-- W の寸法線（ターゲットの直径） -->
  <line x1="420" y1="230" x2="420" y2="266" stroke="#b9c2cd" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="520" y1="230" x2="520" y2="266" stroke="#b9c2cd" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="420" y1="258" x2="520" y2="258" stroke="#202124" stroke-width="1.6" marker-start="url(#fitts-arrow-start)" marker-end="url(#fitts-arrow-end)"/>
  <text x="470" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">W：ターゲットの幅</text>
</svg>
