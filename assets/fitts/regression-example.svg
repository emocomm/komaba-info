<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif" role="img" aria-labelledby="fitts-regression-title">
  <title id="fitts-regression-title">困難指数（ID）とクリック時間（T）の散布図と回帰直線の例</title>

  <!-- グラフタイトル -->
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">クリック時間の変動</text>

  <!-- プロット領域の枠 -->
  <rect x="70" y="40" width="580" height="360" fill="#ffffff" stroke="#d7dde5" stroke-width="1"/>

  <!-- 横グリッド線と Y 目盛り（T: 0〜800） -->
  <g stroke="#eef2f6" stroke-width="1">
    <line x1="70" y1="322.2" x2="650" y2="322.2"/>
    <line x1="70" y1="244.4" x2="650" y2="244.4"/>
    <line x1="70" y1="166.7" x2="650" y2="166.7"/>
    <line x1="70" y1="88.9" x2="650" y2="88.9"/>
  </g>
  <g font-size="12" fill="#66706b" text-anchor="end">
    <text x="62" y="404">0</text>
    <text x="62" y="326">200</text>
    <text x="62" y="248">400</text>
    <text x="62" y="170">600</text>
    <text x="62" y="93">800</text>
  </g>

  <!-- 縦グリッド線と X 目盛り（ID: 2〜5。横軸は 0 から始まらない） -->
  <g stroke="#eef2f6" stroke-width="1">
    <line x1="104.1" y1="40" x2="104.1" y2="400"/>
    <line x1="274.7" y1="40" x2="274.7" y2="400"/>
    <line x1="445.3" y1="40" x2="445.3" y2="400"/>
    <line x1="615.9" y1="40" x2="615.9" y2="400"/>
  </g>
  <g font-size="12" fill="#66706b" text-anchor="middle">
    <text x="104.1" y="418">2</text>
    <text x="274.7" y="418">3</text>
    <text x="445.3" y="418">4</text>
    <text x="615.9" y="418">5</text>
  </g>

  <!-- 軸 -->
  <line x1="70" y1="40" x2="70" y2="400" stroke="#202124" stroke-width="1.6"/>
  <line x1="70" y1="400" x2="650" y2="400" stroke="#202124" stroke-width="1.6"/>

  <!-- 軸タイトル -->
  <text x="360" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#202124">困難指数ID</text>
  <text x="22" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#202124" transform="rotate(-90 22 220)">クリック時間T（ms）</text>

  <!-- 回帰直線。横軸は ID=2 付近から始まるので、左端でも ID=0 には届かない -->
  <line x1="70" y1="232.4" x2="650" y2="73.7" stroke="#a34f22" stroke-width="2.5"/>

  <!-- データ点 -->
  <g fill="#0f766e" stroke="#ffffff" stroke-width="1.5">
    <circle cx="104.1" cy="217.2" r="6"/>
    <circle cx="206.5" cy="205.6" r="6"/>
    <circle cx="291.8" cy="166.7" r="6"/>
    <circle cx="394.1" cy="151.1" r="6"/>
    <circle cx="462.4" cy="116.1" r="6"/>
    <circle cx="615.9" cy="88.9" r="6"/>
  </g>
</svg>
