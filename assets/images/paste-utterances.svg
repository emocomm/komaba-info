<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">B2セルから発話を横に貼り付ける説明図</title>
  <desc id="desc">左端に行番号、その右にA列からH列が並ぶ表で、B2からH2のセル範囲を赤枠で示した注釈画像。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2a00"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#f5f7fb"/>
  <rect x="32" y="36" width="896" height="444" rx="8" fill="#fff" stroke="#d0d7de"/>
  <rect x="32" y="36" width="896" height="44" fill="#eef3f8"/>
  <text x="58" y="64" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="700" fill="#202124">カウント シート</text>

  <rect x="72" y="118" width="816" height="300" fill="#fff" stroke="#d0d7de"/>
  <rect x="72" y="118" width="816" height="40" fill="#f1f3f4"/>
  <rect x="72" y="118" width="40" height="300" fill="#f1f3f4"/>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="72" y1="158" x2="888" y2="158"/>
    <line x1="72" y1="198" x2="888" y2="198"/>
    <line x1="72" y1="238" x2="888" y2="238"/>
    <line x1="72" y1="278" x2="888" y2="278"/>
    <line x1="72" y1="318" x2="888" y2="318"/>
    <line x1="72" y1="358" x2="888" y2="358"/>
    <line x1="72" y1="398" x2="888" y2="398"/>
    <line x1="112" y1="118" x2="112" y2="418"/>
    <line x1="209" y1="118" x2="209" y2="418"/>
    <line x1="306" y1="118" x2="306" y2="418"/>
    <line x1="403" y1="118" x2="403" y2="418"/>
    <line x1="500" y1="118" x2="500" y2="418"/>
    <line x1="597" y1="118" x2="597" y2="418"/>
    <line x1="694" y1="118" x2="694" y2="418"/>
    <line x1="791" y1="118" x2="791" y2="418"/>
  </g>

  <g font-family="Arial,sans-serif" font-size="15" fill="#5f6368">
    <text x="154" y="144" text-anchor="middle">A</text>
    <text x="257" y="144" text-anchor="middle">B</text>
    <text x="354" y="144" text-anchor="middle">C</text>
    <text x="451" y="144" text-anchor="middle">D</text>
    <text x="548" y="144" text-anchor="middle">E</text>
    <text x="645" y="144" text-anchor="middle">F</text>
    <text x="742" y="144" text-anchor="middle">G</text>
    <text x="839" y="144" text-anchor="middle">H</text>
    <text x="92" y="184" text-anchor="middle">1</text>
    <text x="92" y="224" text-anchor="middle">2</text>
    <text x="92" y="264" text-anchor="middle">3</text>
    <text x="92" y="304" text-anchor="middle">4</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#7a828c">
    <text x="257" y="184" text-anchor="middle">1</text>
    <text x="354" y="184" text-anchor="middle">2</text>
    <text x="451" y="184" text-anchor="middle">3</text>
    <text x="548" y="184" text-anchor="middle">4</text>
    <text x="645" y="184" text-anchor="middle">5</text>
    <text x="742" y="184" text-anchor="middle">6</text>
    <text x="839" y="184" text-anchor="middle">7</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#202124">
    <text x="257" y="224" text-anchor="middle">発話1</text>
    <text x="354" y="224" text-anchor="middle">発話2</text>
    <text x="451" y="224" text-anchor="middle">発話3</text>
    <text x="548" y="224" text-anchor="middle">発話4</text>
    <text x="645" y="224" text-anchor="middle">発話5</text>
    <text x="742" y="224" text-anchor="middle">発話6</text>
    <text x="839" y="224" text-anchor="middle">発話7</text>
  </g>

  <rect x="209" y="198" width="679" height="40" fill="none" stroke="#ff2a00" stroke-width="6"/>
  <path d="M456 454 L456 244" fill="none" stroke="#ff2a00" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="274" y="440" width="376" height="56" fill="#fff" stroke="#ff2a00" stroke-width="5"/>
  <text x="296" y="475" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#202124">B2に貼ると横に7発話入る</text>
</svg>
