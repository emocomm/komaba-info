<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">B4に関数を入れてオートフィルする説明図</title>
  <desc id="desc">左端に行番号、その右にA列からH列が並ぶ表で、B4セルとコピー先範囲を赤枠と矢印で示した注釈画像。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2a00"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#f5f7fb"/>
  <rect x="30" y="30" width="900" height="456" rx="8" fill="#fff" stroke="#d0d7de"/>

  <rect x="72" y="104" width="816" height="330" fill="#fff" stroke="#d0d7de"/>
  <rect x="72" y="104" width="816" height="40" fill="#f1f3f4"/>
  <rect x="72" y="104" width="40" height="330" fill="#f1f3f4"/>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="72" y1="144" x2="888" y2="144"/>
    <line x1="72" y1="184" x2="888" y2="184"/>
    <line x1="72" y1="224" x2="888" y2="224"/>
    <line x1="72" y1="264" x2="888" y2="264"/>
    <line x1="72" y1="304" x2="888" y2="304"/>
    <line x1="72" y1="344" x2="888" y2="344"/>
    <line x1="72" y1="384" x2="888" y2="384"/>
    <line x1="72" y1="424" x2="888" y2="424"/>
    <line x1="112" y1="104" x2="112" y2="434"/>
    <line x1="209" y1="104" x2="209" y2="434"/>
    <line x1="306" y1="104" x2="306" y2="434"/>
    <line x1="403" y1="104" x2="403" y2="434"/>
    <line x1="500" y1="104" x2="500" y2="434"/>
    <line x1="597" y1="104" x2="597" y2="434"/>
    <line x1="694" y1="104" x2="694" y2="434"/>
    <line x1="791" y1="104" x2="791" y2="434"/>
  </g>

  <g font-family="Arial,sans-serif" font-size="15" fill="#5f6368">
    <text x="154" y="130" text-anchor="middle">A</text>
    <text x="257" y="130" text-anchor="middle">B</text>
    <text x="354" y="130" text-anchor="middle">C</text>
    <text x="451" y="130" text-anchor="middle">D</text>
    <text x="548" y="130" text-anchor="middle">E</text>
    <text x="645" y="130" text-anchor="middle">F</text>
    <text x="742" y="130" text-anchor="middle">G</text>
    <text x="839" y="130" text-anchor="middle">H</text>
    <text x="92" y="170" text-anchor="middle">1</text>
    <text x="92" y="210" text-anchor="middle">2</text>
    <text x="92" y="250" text-anchor="middle">3</text>
    <text x="92" y="290" text-anchor="middle">4</text>
    <text x="92" y="330" text-anchor="middle">5</text>
    <text x="92" y="370" text-anchor="middle">6</text>
    <text x="92" y="410" text-anchor="middle">...</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#7a828c">
    <text x="257" y="170" text-anchor="middle">1</text>
    <text x="354" y="170" text-anchor="middle">2</text>
    <text x="451" y="170" text-anchor="middle">3</text>
    <text x="548" y="170" text-anchor="middle">4</text>
    <text x="645" y="170" text-anchor="middle">5</text>
    <text x="742" y="170" text-anchor="middle">6</text>
    <text x="839" y="170" text-anchor="middle">7</text>
    <text x="257" y="210" text-anchor="middle">発話1</text>
    <text x="354" y="210" text-anchor="middle">発話2</text>
    <text x="451" y="210" text-anchor="middle">発話3</text>
    <text x="548" y="210" text-anchor="middle">発話4</text>
    <text x="645" y="210" text-anchor="middle">発話5</text>
    <text x="742" y="210" text-anchor="middle">発話6</text>
    <text x="839" y="210" text-anchor="middle">発話7</text>
    <text x="154" y="290" text-anchor="middle">々</text>
    <text x="154" y="330" text-anchor="middle">あ</text>
    <text x="154" y="370" text-anchor="middle">い</text>
  </g>

  <rect x="209" y="264" width="97" height="40" fill="#e6f4ea" stroke="#137333" stroke-width="3"/>
  <text x="219" y="289" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#202124">=LEN(...)</text>
  <rect x="209" y="264" width="97" height="40" fill="none" stroke="#ff2a00" stroke-width="6"/>
  <rect x="209" y="264" width="679" height="156" fill="none" stroke="#ff2a00" stroke-width="5" stroke-dasharray="12 9"/>
  <path d="M324 284 L878 404" fill="none" stroke="#ff2a00" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="112" y="454" width="720" height="52" fill="#fff" stroke="#ff2a00" stroke-width="5"/>
  <text x="134" y="487" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#202124">B4に関数を入れ、右方向・下方向へオートフィル</text>
</svg>
